    />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="description" content="H5 蜘蛛纸牌：支持三种难度、撤销提示、拖拽与点击双操作，音效与背景音乐实时合成。" />
    <title>蜘蛛纸牌 · Spider Solitaire</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <script type="module" crossorigin src="./assets/main-JiDjjkXL.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/types-CFQhqIFX.js">

  <body>
    <div id="app">
      <!-- 首屏加载条：手机上下载牌面素材时先给进度，不要白屏 -->
      <div id="boot-splash" class="splash">
        <div class="splash__inner">
          <div class="splash__mark">♠</div>
          <div class="splash__title">蜘蛛纸牌</div>
          <div class="splash__bar"><span id="boot-bar"></span></div>
          <div class="splash__hint" id="boot-hint">正在准备牌面…</div>
          <button class="btn btn--gold splash__retry" id="boot-retry" type="button" hidden>
            重试加载
          </button>
        </div>
      </div>
      <div id="hud-root"></div>
      <main id="stage"></main>
      <div id="toast-layer" class="toast-layer" aria-live="polite" aria-atomic="true"></div>
      <div id="overlay-layer" class="overlay-layer"></div>
    </div>
  </body>
